<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>LAN party</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <p class="kicker">Fake LAN · Radmin VPN</p>
      <h1 id="title">LAN party</h1>
      <p id="description" class="lead"></p>
      <p id="whoami" class="whoami" hidden></p>
    </div>
  </header>

  <main class="wrap">
    <section id="state" class="card state">
      <h2>Chargement…</h2>
    </section>

    <div id="app" hidden>
      <section id="info-card" class="card" hidden>
        <h2>Infos pratiques</h2>
        <div id="info" class="info"></div>
      </section>

      <section id="form-card" class="card">
        <h2>Ma réponse</h2>
        <form id="form"></form>
      </section>

      <section class="card">
        <h2>Qui vient ?</h2>
        <div id="board"></div>
      </section>
    </div>
  </main>

  <script type="module" src="js/guest.js"></script>
</body>
</html>

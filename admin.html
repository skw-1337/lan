<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Admin · LAN party</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <p class="kicker">Espace organisateur</p>
      <h1>Admin LAN</h1>
      <p id="whoami" class="whoami" hidden></p>
    </div>
  </header>

  <main class="wrap">
    <section id="state" class="card state">
      <h2>Chargement…</h2>
    </section>

    <div id="app" hidden>
      <section class="card">
        <h2>Invités <span id="invite-count" class="count"></span></h2>
        <p class="muted">Crée un lien par personne et envoie-le-lui en privé. Chaque lien ne s'active qu'une fois, sur un seul navigateur.</p>
        <form id="invite-form" class="inline-form">
          <input id="invite-name" type="text" maxlength="40" placeholder="Prénom ou pseudo" aria-label="Prénom ou pseudo de l'invité" required>
          <button class="btn primary" type="submit">Créer le lien</button>
        </form>
        <ul id="invites" class="invites"></ul>
      </section>

      <section class="card">
        <h2>Événement</h2>
        <form id="event-form" class="stack">
          <label>Titre
            <input id="ev-title" type="text" maxlength="80" placeholder="LAN de l'hiver">
          </label>
          <label>Description
            <textarea id="ev-description" rows="2" maxlength="300" placeholder="Une soirée jeux en réseau, chacun chez soi via Radmin VPN."></textarea>
          </label>
          <label>Infos pratiques <span class="muted">(visibles uniquement par les invités)</span>
            <textarea id="ev-info" rows="4" maxlength="1000" placeholder="Réseau Radmin : …&#10;Mot de passe : …&#10;Discord : https://…"></textarea>
          </label>

          <fieldset>
            <legend>Dates proposées</legend>
            <ul id="dates" class="edit-list"></ul>
            <button id="add-date" class="btn ghost" type="button">+ Ajouter une date</button>
          </fieldset>

          <fieldset>
            <legend>Jeux proposés</legend>
            <ul id="games" class="edit-list"></ul>
            <button id="add-game" class="btn ghost" type="button">+ Ajouter un jeu</button>
          </fieldset>

          <div class="form-footer">
            <button class="btn primary" type="submit">Enregistrer l'événement</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Tableau des réponses</h2>
        <div id="board"></div>
      </section>
    </div>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
